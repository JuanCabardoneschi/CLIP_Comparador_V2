<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chat Conversacional - CLIP Comparador V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .config {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .config-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .config-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
        }

        .config-row button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .config-row button:hover {
            background: #218838;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #dee2e6;
        }

        .message-meta {
            font-size: 11px;
            color: #6c757d;
            margin-top: 5px;
            padding: 0 5px;
        }

        .intent-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            margin-left: 5px;
        }

        .intent-saludo { background: #d4edda; color: #155724; }
        .intent-busqueda_general { background: #cce5ff; color: #004085; }
        .intent-busqueda_especifica { background: #fff3cd; color: #856404; }
        .intent-refinamiento { background: #f8d7da; color: #721c24; }
        .intent-multi_categoria { background: #d1ecf1; color: #0c5460; }
        .intent-despedida { background: #e2e3e5; color: #383d41; }

        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .producto-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .producto-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .producto-card h4 {
            font-size: 13px;
            margin-bottom: 5px;
            color: #333;
        }

        .producto-card .score {
            font-size: 11px;
            color: #6c757d;
        }

        .sugerencias {
            margin-top: 10px;
            padding: 10px;
            background: #e7f3ff;
            border-left: 3px solid #0066cc;
            border-radius: 5px;
            font-size: 13px;
        }

        .sugerencias strong {
            display: block;
            margin-bottom: 5px;
            color: #0066cc;
        }

        .sugerencias ul {
            margin: 5px 0 0 20px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ced4da;
            border-radius: 25px;
            font-size: 15px;
        }

        .input-row button {
            padding: 15px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .input-row button:hover {
            background: #5568d3;
        }

        .input-row button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .quick-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .quick-actions button {
            padding: 8px 15px;
            background: #e9ecef;
            color: #495057;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.3s;
        }

        .quick-actions button:hover {
            background: #dee2e6;
        }

        .loading {
            text-align: center;
            padding: 10px;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Chat Conversacional CLIP</h1>
            <p>Sistema inteligente con detección de intenciones</p>
        </div>

        <div class="config">
            <div class="config-row">
                <input type="text" id="apiUrl" value="http://localhost:5000/api/chat" placeholder="URL del API">
                <input type="text" id="apiKey" value="" placeholder="API Key del cliente">
                <button onclick="resetChat()">🔄 Reiniciar Chat</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-bubble">
                    ¡Hola! Soy tu asistente virtual. ¿En qué puedo ayudarte hoy?
                </div>
                <div class="message-meta">Sistema</div>
            </div>
        </div>

        <div class="input-area">
            <div class="quick-actions">
                <button onclick="sendQuickMessage('Hola')">👋 Hola</button>
                <button onclick="sendQuickMessage('Busco delantal rojo')">🔍 Buscar delantal</button>
                <button onclick="sendQuickMessage('Necesito uniforme para chef')">👨‍🍳 Uniforme chef</button>
                <button onclick="sendQuickMessage('Gracias')">✅ Gracias</button>
            </div>
            <div class="input-row">
                <input type="text" id="messageInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" id="sendBtn">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let conversationHistory = [];

        function resetChat() {
            sessionId = null;
            conversationHistory = [];
            document.getElementById('chatMessages').innerHTML = `
                <div class="message assistant">
                    <div class="message-bubble">
                        ¡Hola! Soy tu asistente virtual. ¿En qué puedo ayudarte hoy?
                    </div>
                    <div class="message-meta">Sistema - Chat reiniciado</div>
                </div>
            `;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendQuickMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();

            if (!message) return;

            const apiUrl = document.getElementById('apiUrl').value;
            const apiKey = document.getElementById('apiKey').value;

            if (!apiKey) {
                alert('Por favor ingresa un API Key');
                return;
            }

            // Mostrar mensaje del usuario
            addMessage('user', message);
            messageInput.value = '';

            // Deshabilitar botón mientras procesa
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.textContent = 'Enviando...';

            // Mostrar indicador de carga
            const loadingId = addLoadingMessage();

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });

                const data = await response.json();

                // Remover loading
                removeMessage(loadingId);

                if (data.success) {
                    // Guardar session ID
                    sessionId = data.session_id;

                    // Mostrar respuesta del asistente
                    addMessage('assistant', data.response.mensaje, {
                        intent: data.intent,
                        confidence: data.confidence,
                        productos: data.productos,
                        sugerencias: data.sugerencias
                    });

                } else {
                    addMessage('assistant', `Error: ${data.message || 'Error desconocido'}`, { isError: true });
                }

            } catch (error) {
                removeMessage(loadingId);
                addMessage('assistant', `Error de conexión: ${error.message}`, { isError: true });
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Enviar';
            }
        }

        function addLoadingMessage() {
            const messagesDiv = document.getElementById('chatMessages');
            const loadingId = 'loading-' + Date.now();

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = loadingId;
            messageDiv.innerHTML = `
                <div class="loading">
                    ⏳ Procesando...
                </div>
            `;

            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            return loadingId;
        }

        function removeMessage(messageId) {
            const messageElement = document.getElementById(messageId);
            if (messageElement) {
                messageElement.remove();
            }
        }

        function addMessage(role, text, metadata = {}) {
            const messagesDiv = document.getElementById('chatMessages');

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            let bubbleContent = text;
            let metaInfo = role === 'user' ? 'Tú' : 'Asistente';

            // Agregar intent badge si existe
            if (metadata.intent) {
                const intentClass = `intent-${metadata.intent}`;
                const confidence = (metadata.confidence * 100).toFixed(0);
                metaInfo += ` <span class="intent-badge ${intentClass}">${metadata.intent} (${confidence}%)</span>`;
            }

            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${bubbleContent}
                </div>
                <div class="message-meta">${metaInfo}</div>
            `;

            messagesDiv.appendChild(messageDiv);

            // Agregar productos si existen
            if (metadata.productos && metadata.productos.length > 0) {
                const productosDiv = document.createElement('div');
                productosDiv.className = 'message assistant';

                let productosHTML = '<div class="productos-grid">';
                metadata.productos.forEach(p => {
                    const imageUrl = p.image_url || p.thumbnail_url || 'https://via.placeholder.com/150';
                    const score = (p.similarity_score || p.final_score || 0).toFixed(3);
                    productosHTML += `
                        <div class="producto-card">
                            <img src="${imageUrl}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
                            <h4>${p.name}</h4>
                            <div class="score">Score: ${score}</div>
                        </div>
                    `;
                });
                productosHTML += '</div>';

                productosDiv.innerHTML = productosHTML;
                messagesDiv.appendChild(productosDiv);
            }

            // Agregar sugerencias si existen
            if (metadata.sugerencias && metadata.sugerencias.length > 0) {
                const sugerenciasDiv = document.createElement('div');
                sugerenciasDiv.className = 'message assistant';

                let sugerenciasHTML = '<div class="sugerencias"><strong>💡 Sugerencias:</strong><ul>';
                metadata.sugerencias.forEach(s => {
                    sugerenciasHTML += `<li>${s}</li>`;
                });
                sugerenciasHTML += '</ul></div>';

                sugerenciasDiv.innerHTML = sugerenciasHTML;
                messagesDiv.appendChild(sugerenciasDiv);
            }

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Auto-focus en el input al cargar
        window.onload = function() {
            document.getElementById('messageInput').focus();
        };
    </script>
</body>
</html>
