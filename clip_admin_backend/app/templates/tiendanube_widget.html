<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda con IA - CLIP Comparador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fallback {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 32px;
            text-align: center;
        }
        .actions { margin-top: 14px; display:flex; gap:10px; justify-content:center; }
        .link { color:#374151; text-decoration:underline; cursor:pointer; }
        .fallback h1 {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 12px;
        }
        .fallback p {
            color: #6b7280;
            margin-bottom: 16px;
        }
        .btn-open {
            appearance: none;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="fallback">
        <h1>Búsqueda inteligente</h1>
        <p>Si no se abre automáticamente, hacé clic en el botón:</p>
        <button id="clip-open" class="btn-open">Abrir búsqueda con IA</button>
    </div>

    <!-- Widget CLIP V4 (Overlay) -->
    <script>
        // Configuración requerida por clip-widget-embed-v4.js
        window.CLIPWidget = {
            apiKey: '{{ (api_key or "")|e if api_key is not none else "eve-api-key-2024" }}',
            serverUrl: 'https://clipcomparadorv2-production.up.railway.app'
        };
        function openClipOverlay() {
            if (window.CLIPV2 && window.CLIPV2.overlay && typeof window.CLIPV2.overlay.open === 'function') {
                window.CLIPV2.overlay.open();
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('clip-open');
            if (btn) btn.addEventListener('click', function() {
                openClipOverlay();
                // Ocultar fallback al abrir manualmente
                const fallback = document.querySelector('.fallback');
                if (fallback) fallback.style.display = 'none';
            });
        });
    </script>
    <script src="https://clipcomparadorv2-production.up.railway.app/static/js/clip-widget-embed-v4.js"></script>
    <script>
        // Función para volver a la tienda
        function returnToStore() {
            {% if referer %}
            window.location.href = '{{ referer|e }}';
            {% else %}
            window.history.back();
            {% endif %}
        }

        // Intento de auto-apertura cuando el script terminó de cargar
        window.addEventListener('load', function() {
            setTimeout(function() {
                openClipOverlay();
                // Ocultar el fallback cuando el overlay se abre
                const fallback = document.querySelector('.fallback');
                if (fallback) fallback.style.display = 'none';
            }, 150);

            // Monitorear cierre del overlay detectando cuando desaparece del DOM
            function watchOverlayClose() {
                const checkInterval = setInterval(function() {
                    // Buscar el elemento del overlay (el modal tiene clase específica)
                    const overlayEl = document.querySelector('[class*="clip-overlay"], [id*="clip-overlay"], .modal-overlay, #clipv2-overlay');

                    // Si antes estaba y ahora no está, significa que se cerró
                    if (window._overlayWasOpen && !overlayEl) {
                        clearInterval(checkInterval);
                        returnToStore();
                    }

                    // Marcar que el overlay estuvo abierto
                    if (overlayEl) {
                        window._overlayWasOpen = true;
                    }
                }, 500);
            }

            setTimeout(watchOverlayClose, 1000);
        });
    </script>
</body>
</html>
