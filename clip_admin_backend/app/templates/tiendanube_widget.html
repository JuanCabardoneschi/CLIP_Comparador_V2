<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda con IA - CLIP Comparador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fallback {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 32px;
            text-align: center;
        }
        .actions { margin-top: 14px; display:flex; gap:10px; justify-content:center; }
        .link { color:#374151; text-decoration:underline; cursor:pointer; }
        .fallback h1 {
            font-size: 20px;
            color: #1f2937;
            margin-bottom: 12px;
        }
        .fallback p {
            color: #6b7280;
            margin-bottom: 16px;
        }
        .btn-open {
            appearance: none;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="fallback">
        <h1>Búsqueda inteligente</h1>
        <p>Si no se abre automáticamente, hacé clic en el botón:</p>
        <button id="clip-open" class="btn-open">Abrir búsqueda con IA</button>
        <div class="actions">
            <a id="back-store" class="link">Volver a la tienda</a>
            {% if referer %}
            <span class="link" id="back-store-alt" style="display:none;">Volver (fallback)</span>
            {% endif %}
        </div>
    </div>

    <!-- Widget CLIP V4 (Overlay) -->
    <script>
        // Configuración requerida por clip-widget-embed-v4.js
        window.CLIPWidget = {
            apiKey: '{{ (api_key or "")|e if api_key is not none else "eve-api-key-2024" }}',
            serverUrl: 'https://clipcomparadorv2-production.up.railway.app'
        };
        function openClipOverlay() {
            if (window.CLIPV2 && window.CLIPV2.overlay && typeof window.CLIPV2.overlay.open === 'function') {
                window.CLIPV2.overlay.open();
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            const btn = document.getElementById('clip-open');
            if (btn) btn.addEventListener('click', openClipOverlay);
            const back = document.getElementById('back-store');
            if (back) back.addEventListener('click', function(){
                // Intentar cerrar si se abrió en ventana separada; si no, volver atrás
                try { window.close(); } catch(e) {}
                try { window.history.back(); } catch(e) {}
                // Si tenemos referer explícito, redirigir como último recurso
                {% if referer %}
                try { window.location.href = '{{ referer|e }}'; } catch(e) {}
                {% endif %}
            });
            {% if referer %}
            const backAlt = document.getElementById('back-store-alt');
            if (backAlt) backAlt.addEventListener('click', function(){
                window.location.href = '{{ referer|e }}';
            });
            {% endif %}
            // Intento de compactar ventana si es popup
            try { window.resizeTo(800, 700); } catch(e) {}
        });
    </script>
    <script src="https://clipcomparadorv2-production.up.railway.app/static/js/clip-widget-embed-v4.js"></script>
    <script>
        // Intento de auto-apertura cuando el script terminó de cargar
        window.addEventListener('load', function() {
            setTimeout(openClipOverlay, 150);
            // Intentar enganchar evento de cierre del overlay para volver a la tienda
            function bindOverlayCloseHandler() {
                try {
                    if (window.CLIPV2 && window.CLIPV2.overlay) {
                        const ov = window.CLIPV2.overlay;
                        // Variantes defensivas según API disponible
                        if (typeof ov.on === 'function') {
                            ov.on('close', function(){
                                // Al cerrar overlay, intentar volver a tienda
                                try { window.history.back(); } catch(e) {}
                                {% if referer %}
                                try { window.location.href = '{{ referer|e }}'; } catch(e) {}
                                {% endif %}
                            });
                        } else if (typeof ov.setOnClose === 'function') {
                            ov.setOnClose(function(){
                                try { window.history.back(); } catch(e) {}
                                {% if referer %}
                                try { window.location.href = '{{ referer|e }}'; } catch(e) {}
                                {% endif %}
                            });
                        } else {
                            // Fallback: escuchar Escape para cierre manual
                            document.addEventListener('keydown', function(ev){
                                if (ev.key === 'Escape') {
                                    try { window.history.back(); } catch(e) {}
                                    {% if referer %}
                                    try { window.location.href = '{{ referer|e }}'; } catch(e) {}
                                    {% endif %}
                                }
                            });
                        }
                    }
                } catch(e) { /* no-op */ }
            }
            // Intentar varias veces por si el overlay inicializa tarde
            bindOverlayCloseHandler();
            setTimeout(bindOverlayCloseHandler, 300);
            setTimeout(bindOverlayCloseHandler, 1000);
        });
    </script>
</body>
</html>
