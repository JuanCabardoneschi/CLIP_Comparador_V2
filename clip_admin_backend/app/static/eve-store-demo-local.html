<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve's Store - Visual Search (Local)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .widget-container {
            width: 100%;
            max-width: 1200px;
        }

        .footer {
            color: white;
            text-align: center;
            margin-top: 2rem;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }

        .status {
            color: #fff;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            opacity: 0.95;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Eve's Store (Local)</h1>
        <p>Búsqueda Visual Inteligente - entorno local</p>
    </div>

    <div id="status" class="status">Selecciona un cliente para iniciar el widget</div>

    <div style="margin-bottom: 1rem; text-align:center;">
        <label for="clientSelect" style="color:#fff; margin-right:0.5rem;">Cliente:</label>
        <select id="clientSelect" style="padding:0.4rem 0.6rem; min-width:260px; border-radius:6px; border:0;">
            <option value="">-- elegir cliente --</option>
        </select>
    </div>

    <div class="widget-container">
        <!-- El widget se cargará dinámicamente tras resolver la API Key local -->
        <div id="clip-widget"></div>
    </div>

    <div class="footer">
        <p>Powered by Red Sis SRL</p>
    </div>

    <script>
    (function() {
        const statusEl = document.getElementById('status');

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return Object.fromEntries(params.entries());
        }

        function setQueryParamAndReload(key, value) {
            const url = new URL(window.location.href);
            if (value === undefined || value === null || value === "") {
                url.searchParams.delete(key);
            } else {
                url.searchParams.set(key, value);
            }
            window.location.href = url.toString();
        }

        async function initLocalWidget() {
            try {
                // Usar el mismo origen desde el que se sirve este HTML
                const baseUrl = window.location.origin;

                // Obtener API Key local del primer cliente activo
                const resp = await fetch(baseUrl + '/api/clients/list', { method: 'GET' });
                if (!resp.ok) throw new Error('GET /api/clients/list fallo con status ' + resp.status);
                const data = await resp.json();
                if (!data || !data.clients || data.clients.length === 0) {
                    throw new Error('Sin clientes disponibles en local');
                }
                // Poblar selector
                const select = document.getElementById('clientSelect');
                select.innerHTML = '<option value="">-- elegir cliente --</option>';
                data.clients.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = `${c.name} (${c.product_count || 0} prod.)`;
                    select.appendChild(opt);
                });

                // Leer query params para selección previa
                const qp = getQueryParams();
                let selectedClient = null;
                if (qp.client_id) {
                    selectedClient = data.clients.find(c => String(c.id) === String(qp.client_id));
                } else if (qp.client) {
                    selectedClient = data.clients.find(c => (c.name || '').toLowerCase() === String(qp.client).toLowerCase());
                }

                if (selectedClient) {
                    select.value = selectedClient.id;
                    const apiKey = selectedClient.api_key;
                    window.CLIPWidget = {
                        apiKey: apiKey,
                        serverUrl: baseUrl,
                        containerId: 'clip-widget'
                    };
                    statusEl.textContent = 'Cliente: ' + (selectedClient.name || 'desconocido') + ' | API Key cargada (local)';
                    // Cargar el script del widget una sola vez
                    const s = document.createElement('script');
                    s.src = baseUrl + '/static/js/clip-widget-embed-v3.js';
                    s.async = true;
                    document.body.appendChild(s);
                } else {
                    statusEl.textContent = 'Selecciona un cliente para iniciar el widget';
                }

                // Manejar cambio de cliente: recargar con parámetro para reinicializar limpio
                select.addEventListener('change', (e) => {
                    const clientId = e.target.value;
                    if (!clientId) {
                        statusEl.textContent = 'Selecciona un cliente para iniciar el widget';
                        return;
                    }
                    setQueryParamAndReload('client_id', clientId);
                });
            } catch (err) {
                console.error('Error inicializando widget local:', err);
                statusEl.textContent = 'Error al cargar API Key local: ' + err.message;
            }
        }

        // Iniciar
        initLocalWidget();
    })();
    </script>
</body>
</html>
