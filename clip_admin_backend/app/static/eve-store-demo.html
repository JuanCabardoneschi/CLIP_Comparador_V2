<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve's Store - Visual Search</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .widget-container {
            width: 100%;
            max-width: 1200px;
        }

        .footer {
            color: white;
            text-align: center;
            margin-top: 2rem;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1> Eve's Store</h1>
        <p>Búsqueda Visual Inteligente</p>
    </div>

    <div class="widget-container">
        <script>
            // Configuración estricta solo para producción Railway (evitar ambigüedad)
            window.CLIPWidget = {
                apiKey: 'clip_fe117bcd62de8a1e05a214c5',
                serverUrl: 'https://clipcomparadorv2-production.up.railway.app'
            };
        </script>
        <!-- Widget V3 ya soporta banner de sustitución de categoría en búsquedas de texto -->
        <script src="./js/clip-widget-embed-v3.js"></script>
        <div id="clip-widget"></div>
        <div id="request-timing" style="margin-top:12px;color:#fff;font-size:0.95rem;font-weight:500;">
            ⏱ Esperando primera búsqueda...
        </div>
        <script>
            (function(){
                const timingEl = document.getElementById('request-timing');
                if(!timingEl) return;
                const originalFetch = window.fetch;
                window.fetch = async function(...args){
                    const url = (args[0] && args[0].toString()) || '';
                    const isSearch = /\/api\/(search|search\/text|search\/unified)/.test(url);
                    const start = performance.now();
                    let roundTripMs = 0;
                    try {
                        const resp = await originalFetch(...args);
                        roundTripMs = performance.now() - start;
                        if(isSearch){
                            let serverTime = null;
                            try {
                                const cloned = resp.clone();
                                const data = await cloned.json();
                                serverTime = data.search_time_seconds || data.processing_time || null;
                                const cat = data.detected_category ? (data.detected_category.name || '') : '';
                                timingEl.textContent = `⏱ Última búsqueda: ${(roundTripMs).toFixed(0)} ms (red)${serverTime!==null?` | servidor: ${serverTime.toFixed(3)}s`:''}${cat?` | categoría: ${cat}`:''}`;
                            } catch(e){
                                timingEl.textContent = `⏱ Última búsqueda: ${(roundTripMs).toFixed(0)} ms (sin parse JSON)`;
                            }
                        }
                        return resp;
                    } catch(err){
                        if(isSearch){
                            timingEl.textContent = `⏱ Error en búsqueda tras ${(performance.now()-start).toFixed(0)} ms: ${err}`;
                        }
                        throw err;
                    }
                };
            })();
        </script>
    </div>

    <div class="footer">
        <p>Powered by Red Sis SRL</p>
    </div>
</body>
</html>
