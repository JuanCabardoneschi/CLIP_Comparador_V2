<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Búsqueda Textual - CLIP Comparador V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #64748b;
            font-size: 1.1rem;
        }

        .search-box {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }

        .search-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .info-section {
            margin-bottom: 2rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .info-card {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .info-label {
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .info-value {
            color: #1e293b;
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin: 0.25rem;
        }

        .badge-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .product-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .product-image {
            position: relative;
            width: 100%;
            height: 160px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .match-badge {
            position: absolute;
            top: 8px;
            left: 8px;
        }

        .product-name {
            padding: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            text-align: center;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .product-info {
            padding: 0.75rem;
            font-size: 0.75rem;
            color: #64748b;
        }

        .product-info-row {
            margin-bottom: 0.5rem;
        }

        .product-info-row:last-child {
            margin-bottom: 0;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 12px;
            margin-top: 1rem;
        }

        .json-view {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 12px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            margin-top: 1rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .categories-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .attributes-list {
            margin-top: 0.5rem;
        }

        .attribute-item {
            background: #f1f5f9;
            padding: 0.5rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .attribute-key {
            font-weight: 600;
            color: #334155;
        }

        .attribute-label {
            color: #64748b;
            font-size: 0.75rem;
        }

        .badge-neutral {
            background: #e2e8f0;
            color: #334155;
        }

        .section-subtitle {
            font-size: 0.75rem;
            font-weight: 700;
            color: #334155;
            margin: 0.25rem 0 0.5rem 0;
        }

        .mini-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
        }

        .info-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 1.25rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        .info-banner-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-banner-label {
            font-weight: 600;
            opacity: 0.95;
            font-size: 0.875rem;
            white-space: nowrap;
        }

        .info-banner-content {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .banner-badge {
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .banner-badge-highlight {
            background: rgba(255,255,255,0.95);
            color: #667eea;
            font-weight: 600;
        }

        .banner-visual-note {
            font-size: 0.75rem;
            opacity: 0.85;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Test Búsqueda Textual</h1>
            <p>Testing endpoint /api/search/text con breakpoint activo</p>
        </div>

        <div class="search-box">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Ej: delantales con cierre al costado y bolsillos grandes"
                value="delantales con cierre al costado y bolsillos grandes"
            >
            <button class="search-btn" id="searchBtn" onclick="buscar()">
                🔍 Buscar Productos
            </button>
        </div>

        <div id="resultsContainer" style="display: none;">
            <div class="results">
                <!-- Banner informativo visual -->
                <div class="info-banner" id="infoBanner">
                    <!-- Se llena dinámicamente desde JS -->
                </div>

                <!-- Productos -->
                <div class="info-section">
                    <div class="section-title">📦 Top 5 Productos</div>
                    <div class="products-grid" id="productsGrid"></div>
                </div>

                <!-- JSON Raw (oculto por defecto) -->
                <div class="info-section" style="display:none;">
                    <div class="section-title">📋 Response JSON (Raw)</div>
                    <div class="json-view" id="jsonView"></div>
                </div>
            </div>
        </div>

        <div id="loadingContainer" style="display: none;">
            <div class="results loading">
                <div class="spinner"></div>
                <p>Buscando productos...</p>
            </div>
        </div>

        <div id="errorContainer" style="display: none;">
            <div class="results">
                <div class="error" id="errorMessage"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/search/text';
        const API_KEY = 'test-api-key-demo-fashion-store-2024';

        async function buscar() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                alert('Por favor ingresá una búsqueda');
                return;
            }

            // Ocultar todo
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'none';
            document.getElementById('loadingContainer').style.display = 'block';

            // Deshabilitar botón
            const btn = document.getElementById('searchBtn');
            btn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': API_KEY
                    },
                    body: JSON.stringify({ query, limit: 10 })
                });

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || data.error || 'Error desconocido');
                }

                mostrarResultados(data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loadingContainer').style.display = 'none';
                document.getElementById('errorContainer').style.display = 'block';
                document.getElementById('errorMessage').textContent = `Error: ${error.message}`;
            } finally {
                btn.disabled = false;
            }
        }

        function mostrarResultados(data) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'block';

            // Renderizar banner informativo
            renderBanner(data);

            // Productos
            const productsGrid = document.getElementById('productsGrid');
            productsGrid.innerHTML = '';

            if (data.filtering?.top_5_productos && data.filtering.top_5_productos.length > 0) {
                data.filtering.top_5_productos.forEach((prod, index) => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    // Badge por tipo de match
                    const match = (prod.match_type || 'BASE').toUpperCase();
                    const matchClass = match === 'AMBOS' ? 'badge-success' : (match === 'FUERTE' ? 'badge-info' : (match === 'DÉBIL' || match === 'DEBIL' ? 'badge-warning' : 'badge-neutral'));

                    // Imagen
                    const imgHtml = prod.image_url
                        ? `<img src="${prod.image_url}" alt="${(prod.name||'Producto')}">`
                        : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:0.8rem;">Sin imagen</div>`;

                    // Cobertura de atributos fuertes
                    const attrs = Array.isArray(prod.attributes_coverage) ? prod.attributes_coverage : [];
                    const attrsHtml = attrs.length > 0
                        ? attrs.map(a => {
                            const ok = !!a.exists;
                            const label = a.label || a.key || 'atributo';
                            const value = (a.value !== undefined && a.value !== null && `${a.value}`.trim() !== '') ? `: ${a.value}` : '';
                            const cls = ok ? 'badge-success' : 'badge-error';
                            const icon = ok ? '✅' : '✖️';
                            return `<span class="badge ${cls}" title="${a.key || ''}">${icon} ${label}${value}</span>`;
                        }).join(' ')
                        : '<span class="badge badge-neutral">Sin atributos</span>';

                    const safeId = (prod.id && typeof prod.id === 'string') ? prod.id.substring(0,8) + '…' : 'N/A';

                    card.innerHTML = `
                        <div class="product-image">
                            ${imgHtml}
                            <span class="badge ${matchClass} match-badge">${match}</span>
                        </div>
                        <div class="product-name">${prod.name || 'Producto'}</div>
                        <div class="product-info">
                            <div class="product-info-row"><strong>SKU:</strong> ${prod.sku || 'N/A'}</div>
                            <div class="product-info-row"><strong>Categoría:</strong> ${prod.category || 'N/A'}</div>
                            <div class="product-info-row"><strong>ID:</strong> ${safeId}</div>
                            <div class="section-subtitle">Atributos</div>
                            <div class="mini-badges">${attrsHtml}</div>
                        </div>
                    `;
                    productsGrid.appendChild(card);
                });
            } else {
                const empty = document.createElement('div');
                empty.style.color = '#64748b';
                empty.textContent = 'No hay productos en top_5_productos (ver JSON Raw abajo para depurar).';
                productsGrid.appendChild(empty);
            }

            // JSON Raw (oculto)
            document.getElementById('jsonView').textContent = JSON.stringify(data, null, 2);
        }

        function renderBanner(data) {
            const banner = document.getElementById('infoBanner');
            let items = [];

            // 1. Categorías detectadas
            const categorias = data.detection?.categorias_matched || [];
            if (categorias.length > 0) {
                const cats = categorias.map(cat => 
                    `<span class="banner-badge banner-badge-highlight">${cat.name}</span>`
                ).join(' ');
                items.push(`<div class="info-banner-item"><span class="info-banner-label">Buscando en:</span><div class="info-banner-content">${cats}</div></div>`);
            }

            // 2. Atributos fuertes
            const attrsFuertes = data.analysis?.atributos_encontrados || [];
            if (attrsFuertes.length > 0) {
                const attrs = attrsFuertes.map(a => 
                    `<span class="banner-badge">${a.atributo_label || a.atributo_key}</span>`
                ).join(' ');
                items.push(`<div class="info-banner-item"><span class="info-banner-label">Filtrando:</span><div class="info-banner-content">${attrs}</div></div>`);
            }

            // 3. Atributos débiles
            const attrsDebiles = data.analysis?.modificadores_no_configurados || [];
            if (attrsDebiles.length > 0) {
                const mods = attrsDebiles.map(m => 
                    `<span class="banner-badge">${m}</span>`
                ).join(' ');
                items.push(`<div class="info-banner-item"><span class="info-banner-label">Similitud visual:</span><div class="info-banner-content">${mods}</div></div>`);
            }

            banner.innerHTML = items.join('');
        }

        // Permitir buscar con Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscar();
            }
        });
    </script>
</body>
</html>
