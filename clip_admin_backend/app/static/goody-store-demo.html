<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goody Store - Visual Search</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .widget-container {
            width: 100%;
            max-width: 1200px;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 2rem;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛍️ Goody Store</h1>
        <p>Búsqueda Visual Inteligente</p>
    </div>

    <div class="widget-container">
        <!-- ============================================ -->
        <!-- CLIP Widget - Solo 3 líneas de integración -->
        <!-- ============================================ -->

        <script>
            window.CLIPWidget = {
                apiKey: 'test-api-key-demo-fashion-store-2024',
                serverUrl: 'https://clipcomparadorv2-production.up.railway.app'
            };
        </script>

        <div id="clip-widget"></div>

        <script src="https://clipcomparadorv2-production.up.railway.app/static/js/clip-widget-embed-v3.js"></script>

        <!-- ============================================ -->
    </div>

    <div class="footer">
        <p>Powered by <a href="https://platform.openai.com/docs/guides/vision" target="_blank">GPT-4 Vision</a> & <a href="https://github.com/openai/CLIP" target="_blank">OpenAI CLIP</a></p>
    </div>
</body>
</html>
